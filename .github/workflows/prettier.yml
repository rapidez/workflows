name: prettier

on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest

jobs:
  test:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node dependencies
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@lts
          cache: false
          install: true

      - name: Execute tests
        run: ./node_modules/.bin/prettier resources --check
