name: Playwright

on:
  workflow_call:
    inputs:
      package:
        description: 'The Rapidez package name, for example "core" for rapidez/core'
        required: true
        type: string
      setup:
        description: 'Shell commands to run within the Rapidez project after the installation, before the frontend build. For example the installation steps from the readme.'
        required: false
        type: string
        default: ''
      update-all-screenshots:
        required: false
        type: boolean
        default: false

env:
  PACKAGE: ${{ inputs.package }}

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./rapidez/rapidez

    strategy:
      fail-fast: false
      matrix:
        include:
          - magento-version: 2.4.8-p5
            magento-php-version: php84-fpm
            magento-image: michielgerritsen/magento-project-community-edition:php84-fpm-magento2.4.8-p5-sample-data
            rapidez-php-version: 8.4
          - magento-version: 2.4.9
            magento-php-version: php85-fpm
            magento-image: michielgerritsen/magento-project-community-edition:php85-fpm-magento2.4.9-sample-data
            rapidez-php-version: 8.5
            screenshots: true
          - magento-version: mage-os-3.6.0
            magento-php-version: php85-fpm
            magento-image: michielgerritsen/mage-os-community-edition:php85-fpm-mage-os3.6.0-sample-data
            rapidez-php-version: 8.5

    services:
      magento:
        image: ${{ matrix.magento-image }}
        env:
          URL: http://localhost:1234/
          ENABLE_CORS: true
          CUSTOM_ENTRYPOINT_COMMAND: 'php bin/magento encryption:key:change -k 5AM3SD5SkwT8iwIxL6L1q8XQhzK3wk51; magerun2 config:store:set system/smtp/disable 1; magerun2 config:store:set checkout/options/enable_guest_checkout_login 1; magerun2 config:store:delete design/head/includes'
        ports:
          - 3307:3306
          - 1234:80

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.18.2
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
          http.cors.enabled: "true"
          http.cors.allow-credentials: "true"
          http.cors.allow-origin: "http://localhost:8000"
          http.cors.allow-headers: X-Requested-With, X-Auth-Token, Content-Type, Content-Length, Authorization, Access-Control-Allow-Headers, Accept
          xpack.security.enabled: "false"
        options: >-
          --health-cmd="curl http://localhost:9200/_cluster/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    name: P${{ matrix.rapidez-php-version }} - M${{matrix.magento-version}} on ${{matrix.magento-php-version}}

    steps:
      - uses: actions/checkout@v4
        with:
          path: rapidez/${{ env.PACKAGE }}
          fetch-depth: 0
          lfs: true

      - uses: actions/checkout@v4
        with:
          repository: rapidez/rapidez
          path: rapidez/rapidez

      # For the webserver configs
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: rapidez-workflows
          sparse-checkout: .github/playwright

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.rapidez-php-version }}
          extensions: mbstring, dom, fileinfo, mysql
          coverage: none

      - name: Copy testing .env
        run: cp ../$PACKAGE/tests/playwright/.env.testing .env

      # Mirror instead of symlink, pnpm skips workspace packages outside the root
      - name: Use Rapidez package from source
        run: composer config repositories.$PACKAGE '{"type":"path","url":"../${{ env.PACKAGE }}","options":{"symlink":false}}'

      - name: Make the Magento version available as env variable
        run: echo "MAGENTO_VERSION=${{ matrix.magento-version }}" >> $GITHUB_ENV

      - name: Get commit hash and tag of the package
        working-directory: ./rapidez/${{ env.PACKAGE }}
        run: |
          echo "PACKAGE_HASH=$(git symbolic-ref --short HEAD 2>/dev/null || git rev-parse HEAD | sed 's|/|_|g')" >> $GITHUB_ENV
          echo "LATEST_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

      - name: Get correct version name for require
        run: echo "REQUIRE_VERSION=$([[ '${{ env.PACKAGE_HASH }}' =~ ^[0-9]+\.[xX]$ ]] && echo '${{ env.PACKAGE_HASH }}-dev' || echo 'dev-${{ env.PACKAGE_HASH }}')" >> $GITHUB_ENV

      - name: Composer require the local rapidez package
        run: composer require rapidez/$PACKAGE:"${{ env.REQUIRE_VERSION }} as ${{ env.LATEST_TAG }}"

      - name: Install Rapidez command
        run: php artisan rapidez:install --frontendonly

      - name: Package specific setup
        if: ${{ inputs.setup != '' }}
        env:
          SCRIPT: ${{ inputs.setup }}
        run: eval "$SCRIPT"

      - name: Publish payment icons
        run: php artisan vendor:publish --tag=payment-icons

      - name: Install Node dependencies
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@lts
          cache: false
          install: true
          working-directory: rapidez/rapidez

      - name: Get the Playwright browsers cache key
        id: playwright-cache-key
        run: echo "key=playwright-browsers-${{ runner.os }}-$(pnpm exec playwright --version | cut -d' ' -f2)-$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Restore the Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache-key.outputs.key }}

      - name: Install Playwright Browsers
        timeout-minutes: 10
        run: pnpm playwright install --with-deps

      - name: Cache the Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache-key.outputs.key }}

      - name: Frontend Build
        run: pnpm run prod

      - name: Install Playwright tests
        run: |
          cp -r ../$PACKAGE/tests/playwright tests/playwright
          cp ../$PACKAGE/playwright.config.js playwright.config.js

      - name: Add tier prices
        run: mysql -h 127.0.0.1 -P 3307 -u magento -ppassword magento -ss < vendor/rapidez/core/tests/database/tier-prices.sql

      - name: Give the sample reviews a unique date, the order is undefined otherwise
        run: mysql -h 127.0.0.1 -P 3307 -u magento -ppassword magento -e "UPDATE review SET created_at = created_at - INTERVAL review_id SECOND"

      - name: Rapidez index
        run: php artisan rapidez:index

      - name: Start the webserver
        run: |
          php-fpm${{ matrix.rapidez-php-version }} -p "$PWD" -y $GITHUB_WORKSPACE/rapidez-workflows/.github/playwright/php-fpm.conf
          nginx -p "$PWD" -e storage/logs/nginx-error.log -c $GITHUB_WORKSPACE/rapidez-workflows/.github/playwright/nginx.conf
          curl --fail --silent --output /dev/null http://localhost:8000

      - name: Run Playwright tests
        if: ${{ !inputs.update-all-screenshots }}
        run: pnpm playwright test

      # Screenshots
      - name: Collect failed tests
        if: ${{ failure() && !inputs.update-all-screenshots }}
        run: pnpm playwright test --last-failed --list --reporter=dot --pass-with-no-tests > failed-tests.txt

      - name: Update screenshots
        if: ${{ failure() && !inputs.update-all-screenshots && matrix.screenshots == true && github.event_name != 'schedule' && !(github.event_name == 'push' && (github.ref_name == 'master' || endsWith(github.ref_name, '.x'))) }}
        run: |
          while read -r test_name; do
            pnpm playwright test "$test_name" --update-snapshots --reporter=list
          done < <(awk -F ' › ' 'NF>1{print $2}' failed-tests.txt | xargs -n1 basename | sort -u)

      - name: Update all screenshots
        if: ${{ inputs.update-all-screenshots && matrix.screenshots == true }}
        run: pnpm playwright test --update-snapshots

      - name: Move the screenshots
        if: (failure() || inputs.update-all-screenshots) && matrix.screenshots == true && github.event_name != 'schedule' && !(github.event_name == 'push' && (github.ref_name == 'master' || endsWith(github.ref_name, '.x')))
        run: cp -r tests/playwright/. ../$PACKAGE/tests/playwright/

      - name: Commit the screenshots
        if: (failure() || inputs.update-all-screenshots) && matrix.screenshots == true && github.event_name != 'schedule' && !(github.event_name == 'push' && (github.ref_name == 'master' || endsWith(github.ref_name, '.x')))
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "[CI] Update Snapshots"
          repository: rapidez/${{ env.PACKAGE }}

      # Artifact
      - name: Dump docker logs
        if: failure()
        uses: jwalton/gh-docker-logs@v2
        with:
          dest: './docker-logs'

      - name: Dump magento logs
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p magento/var
          docker cp ${{ job.services.magento.id }}:/data/var/log magento/var/log

      - name: Upload Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-P${{ matrix.rapidez-php-version }}-M${{matrix.magento-version}}-on-${{matrix.magento-php-version}}
          path: |
            rapidez/rapidez/blob-report
            rapidez/rapidez/storage/logs
            docker-logs
            magento/var/log

  report:
    if: failure()
    needs: [test]
    runs-on: ubuntu-latest
    env:
      HTML_REPORT_PATH: ${{ github.repository }}/${{ github.ref_name }}/${{ github.run_id }}/${{ github.run_attempt }}

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install @playwright/test

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./reports
          merge-multiple: true

      - name: Generate HTML report
        run: npx playwright merge-reports --reporter html ./reports/rapidez/rapidez/blob-report

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Push to Cloudflare R2
        uses: ryand56/r2-upload-action@v1.4
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: ./playwright-report
          destination-dir: ${{ env.HTML_REPORT_PATH }}

      - name: URL in summary
        run: echo "### Test results - https://playwright.rapidez.io/${{ env.HTML_REPORT_PATH }}/index.html" >> $GITHUB_STEP_SUMMARY
